[package]
name = "hermit-dynamorio"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true
license = "BSD-3-Clause"
description = "DynamoRIO physical adapter for the shared Hermit application"

[lib]
name = "hermit_dynamorio"
path = "src/lib.rs"

[[bin]]
name = "hermit-dynamorio"
path = "src/main.rs"

[[bin]]
name = "check-current-engine-client"
path = "src/bin/check_current_engine_client.rs"

[dependencies]
hermit = { workspace = true }
detcore = { workspace = true }
detcore-model = { workspace = true }
hermit-test-workdir = { workspace = true }
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
fbinit = { version = "0.2.0", git = "https://github.com/facebookexperimental/rust-shed.git", branch = "main" }
libc = "0.2.186"
rand = "0.10.2"
reverie = { workspace = true }
reverie-dynamorio = { workspace = true }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }

# The original qualification consumers retain their dependency selections.
# The moved affinity parity case uses nix only as a native CPU-mask oracle.
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }

[dev-dependencies]
reverie-dynamorio = { workspace = true, features = ["launch-observation"] }
# Retained only for the genuine legacy placement/fingerprint tests awaiting transfer.
detcore-dynamorio = { workspace = true }
nix = { version = "0.30.1", features = ["process", "sched"] }
