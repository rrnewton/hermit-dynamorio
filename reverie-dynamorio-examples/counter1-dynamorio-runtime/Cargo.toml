# Transfer origin: reverie@e9c54de934df30175dbbfff162b1a4fcfa7670e7 reverie-examples/counter1-dbt-runtime.
# OSS-only external caller artifact over the unchanged Counter1 Tool sources.
[package]
name = "reverie-counter1-dynamorio-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "counter1_caller_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dynamorio]
artifact-label = "counter1"
input-roots = []

# Deliberately independent: a parent --workspace --all-features build enables
# DYNAMORIO's prototype exports, which must not be linked into this caller artifact.
# The explicit producer and standalone gates below remain mandatory.
[workspace]
resolver = "2"

[dependencies]
reverie = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944", package = "reverie-core" }
reverie-dynamorio = { version = "0.5.4", path = "../../reverie-dynamorio", default-features = false }
reverie-examples = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
