# OSS-only external caller artifact over the unchanged Strace Tool sources.
# Keep a corresponding internal target synchronized before the next export.
[package]
name = "reverie-strace-dynamorio-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "caller_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dynamorio]
artifact-label = "strace"
input-roots = []

# Deliberately independent: a parent --workspace --all-features build enables
# DYNAMORIO's prototype exports, which must not be linked into this caller artifact.
# The explicit producer and standalone gates below remain mandatory.
[workspace]
resolver = "2"

[dependencies]
reverie = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "42b59ad872680b7e7815fc7a88ed76ca3a233832", package = "reverie-core" }
reverie-dynamorio = { version = "0.5.4", path = "../../reverie-dynamorio", default-features = false }
reverie-examples = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "42b59ad872680b7e7815fc7a88ed76ca3a233832", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"

[dev-dependencies]
reverie-examples = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "42b59ad872680b7e7815fc7a88ed76ca3a233832", default-features = false, features = ["test-support"] }
